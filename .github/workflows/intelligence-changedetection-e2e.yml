name: Optional intelligence changedetection self-host E2E

on:
  pull_request:
    paths:
      - "src/mcp_trendpulse/intelligence_*.py"
      - "scripts/intelligence_mcp_client_e2e.py"
      - "scripts/intelligence_changedetection_fixture.py"
      - ".github/workflows/intelligence-changedetection-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  disposable-local-watch:
    name: Real change monitor + authenticated MCP read-only watch listing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - name: Launch isolated free changedetection container
        run: |
          docker pull ghcr.io/dgtlmoon/changedetection.io:latest
          mkdir -p "$RUNNER_TEMP/trendpulse-disposable-change"
          docker run -d --name trendpulse-change-ci --init \
            --memory 1g --pids-limit 256 --security-opt no-new-privileges \
            --publish 127.0.0.1:5000:5000 \
            -v "$RUNNER_TEMP/trendpulse-disposable-change:/datastore" \
            -e LOGGER_LEVEL=WARNING -e LISTEN_HOST=0.0.0.0 \
            ghcr.io/dgtlmoon/changedetection.io:latest
          docker image inspect ghcr.io/dgtlmoon/changedetection.io:latest --format '{{json .RepoDigests}}'
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:5000/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 80 trendpulse-change-ci
          exit 1
      - name: Seed a paused watch and call the real MCP client
        env:
          TRENDPULSE_E2E_DISPOSABLE_INSTANCE: YES
        run: |
          key=$(docker exec -i --user 0 trendpulse-change-ci python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path('/datastore')
          paths = (root / 'changedetection.json', root / 'url-watches.json')
          for p in paths:
              if not p.exists():
                  continue
              data = json.loads(p.read_text(encoding='utf-8'))
              value = data.get('settings', {}).get('application', {}).get('api_access_token')
              if isinstance(value, str) and len(value) > 12:
                  print(value)
                  sys.exit(0)
          sys.exit(1)
          PY
          )
          if [ -z "$key" ]; then echo 'Ephemeral service API key was not generated'; exit 1; fi
          export TRENDPULSE_INTEL_CHANGEDETECTION_KEY="$key"
          uv run --locked python scripts/intelligence_changedetection_fixture.py
          uv run --locked python scripts/intelligence_mcp_client_e2e.py --mode changedetection --report intelligence-changedetection-mcp.json
          unset TRENDPULSE_INTEL_CHANGEDETECTION_KEY
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changedetection-mcp-${{ github.run_id }}
          path: intelligence-changedetection-mcp.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove ephemeral service and watch
        if: always()
        run: |
          docker rm -f trendpulse-change-ci || true
          if [ -n "$RUNNER_TEMP" ]; then
            sudo rm -rf -- "$RUNNER_TEMP/trendpulse-disposable-change"
          fi
