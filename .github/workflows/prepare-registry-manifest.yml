name: Prepare official Registry manifest

on:
  push:
    branches:
      - chore/official-mcp-registry
    paths:
      - .github/workflows/prepare-registry-manifest.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/official-mcp-registry
      - name: Add verified PyPI install metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          server_path = Path('server.json')
          server = json.loads(server_path.read_text())
          server['packages'] = [{
              'registryType': 'pypi',
              'registryBaseUrl': 'https://pypi.org',
              'identifier': 'mcp-trendpulse',
              'version': '0.2.10',
              'runtimeHint': 'uvx',
              'transport': {'type': 'stdio'},
          }]
          server_path.write_text(json.dumps(server, indent=2, ensure_ascii=False) + '\n')

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          marker = '<!-- mcp-name: io.github.AKzar1el/mcp-trendpulse -->'
          if marker not in readme:
              readme = readme.rstrip() + '\n\n' + marker + '\n'
              readme_path.write_text(readme)
          PY
      - name: Commit generated Registry metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.json README.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore: add official Registry package metadata'
          git push origin HEAD:chore/official-mcp-registry
