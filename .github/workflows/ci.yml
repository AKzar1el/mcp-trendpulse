name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10.18"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Verify native dependencies use wheels on Python 3.14
        if: matrix.python-version == '3.14'
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: >-
          uv sync --locked --dev --no-install-project
          --no-build-package cffi
          --no-build-package cryptography
          --no-build-package greenlet
          --no-build-package lxml
          --no-build-package numpy
          --no-build-package pandas
          --no-build-package pillow
          --no-build-package pydantic-core
          --no-build-package pyyaml
          --no-build-package regex
          --no-build-package rpds-py
          --no-build-package selectolax

      - name: Sync locked environment
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --dev

      - name: Run unit tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --locked pytest

      - name: Run Ruff
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --locked ruff check .

  package:
    name: Package validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lockfile and sync environment
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked --dev

      - name: Build distributions
        env:
          UV_PYTHON: "3.12"
        run: uv build

      - name: Validate distribution metadata
        env:
          UV_PYTHON: "3.12"
        run: uv run --with twine twine check dist/*

      - name: Smoke test built wheel
        run: |
          SMOKE_VENV="${RUNNER_TEMP}/mcp-trendpulse-wheel-smoke"
          uv venv --python 3.12 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" dist/*.whl
          "$SMOKE_VENV/bin/python" -c "import mcp_trendpulse"
