name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 5c7cff42fcd3423b8e2d2c86a4c628c5.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp 5c7cff42fcd3423b8e2d2c86a4c628c5.txt _site/5c7cff42fcd3423b8e2d2c86a4c628c5.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
