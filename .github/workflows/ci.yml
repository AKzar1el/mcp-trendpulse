---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Smoke-test built wheel
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel" python -c "import mcp_trendpulse"
