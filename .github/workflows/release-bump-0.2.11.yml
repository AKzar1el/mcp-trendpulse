name: Prepare TrendPulse 0.2.11

on:
  push:
    branches:
      - release/trendpulse-0.2.11
    paths:
      - .github/workflows/release-bump-0.2.11.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"

      - name: Install Python
        run: uv python install 3.12

      - name: Apply surgical version bump
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "pyproject.toml": ('version = "0.2.10"', 'version = "0.2.11"', 1),
              "manifest.json": ('"version": "0.2.10"', '"version": "0.2.11"', 1),
              "server.json": ('"version": "0.2.10"', '"version": "0.2.11"', 2),
              ".github/workflows/publish.yml": ("version = '0.2.10'", "version = '0.2.11'", 1),
              ".cursor-plugin/plugin.json": ('"version": "0.2.10"', '"version": "0.2.11"', 1),
              "uv.lock": ('name = "mcp-trendpulse"\nversion = "0.2.10"', 'name = "mcp-trendpulse"\nversion = "0.2.11"', 1),
          }

          for filename, (old, new, expected) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{filename}: expected {expected} occurrence(s) of {old!r}, found {count}")
              path.write_text(text.replace(old, new))
          PY

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          version = "0.2.11"
          project = tomllib.loads(Path("pyproject.toml").read_text())
          manifest = json.loads(Path("manifest.json").read_text())
          server = json.loads(Path("server.json").read_text())
          cursor = json.loads(Path(".cursor-plugin/plugin.json").read_text())
          publish = Path(".github/workflows/publish.yml").read_text()
          lock = Path("uv.lock").read_text()

          assert project["project"]["version"] == version
          assert manifest["version"] == version
          assert server["version"] == version
          assert server["packages"][0]["version"] == version
          assert cursor["version"] == version
          assert "version = '0.2.11'" in publish
          assert 'name = "mcp-trendpulse"\nversion = "0.2.11"' in lock
          assert "0.2.10" not in Path("pyproject.toml").read_text()
          assert "0.2.10" not in Path("manifest.json").read_text()
          assert "0.2.10" not in Path("server.json").read_text()
          assert "0.2.10" not in Path(".cursor-plugin/plugin.json").read_text()
          PY

      - name: Sync locked environment
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked --dev

      - name: Run unit tests
        env:
          UV_PYTHON: "3.12"
        run: uv run --locked pytest

      - name: Run Ruff
        env:
          UV_PYTHON: "3.12"
        run: uv run --locked ruff check .

      - name: Build package distributions
        env:
          UV_PYTHON: "3.12"
        run: uv build

      - name: Validate package metadata
        env:
          UV_PYTHON: "3.12"
        run: uv run --with twine twine check dist/*

      - name: Commit validated non-workflow metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml manifest.json server.json .cursor-plugin/plugin.json uv.lock
          git diff --cached --check
          git commit -m "Release TrendPulse 0.2.11 metadata"
          git push origin HEAD:release/trendpulse-0.2.11
