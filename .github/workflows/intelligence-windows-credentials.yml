name: Optional intelligence Windows secure settings

on:
  pull_request:
    paths:
      - "src/mcp_trendpulse/intelligence_settings.py"
      - "scripts/intelligence_windows_credential_smoke.py"
      - ".github/workflows/intelligence-windows-credentials.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-credential-store:
    name: Windows Credential Manager real roundtrip
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"
      - name: Install Python
        run: uv python install 3.12
      - name: Secure, disposable WinCred roundtrip
        env:
          PYTHONPATH: src
        run: uv run --no-project --python 3.12 python scripts/intelligence_windows_credential_smoke.py
