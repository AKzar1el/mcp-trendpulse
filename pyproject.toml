[project]
name = "mcp-trendpulse"
version = "0.2.32"
description = "MCP server for Google News research and Google Trends analysis"
readme = "README.md"
requires-python = ">=3.10.18"
authors = [{ name = "Tomi Šeregi" }]
keywords = ["google", "news", "rss", "trends", "mcp", "fastmcp", "llm", "nlp", "seo", "keyword-research", "market-research", "content-strategy"]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4.14.2",
    "click>=8.3.3",
    "cloudscraper>=1.2.71",
    "cryptography>=50.0.0",
    "fastmcp>=3.2.0,<4",
    "filelock>=3.20.3",
    "gnews>=0.4.1",
    "googlenewsdecoder>=0.1.7",
    "lxml[html-clean]>=6.1.1",
    "lxml-html-clean>=0.4.4",
    "newspaper4k>=0.9.6",
    "nltk>=3.10.3",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "pandas>=2.3.0",
    "playwright>=1.53.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "soupsieve>=2.9.0",
    "trendspy>=0.1.6",
    "urllib3>=2.7.0",
]

[project.scripts]
mcp-trendpulse = "mcp_trendpulse.server:main"
mcp-trendpulse-cli = "mcp_trendpulse.cli:cli"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.1",
]


[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-m", "not integration"]
asyncio_mode = "auto"
pythonpath = "src"
markers = [
    "integration: tests that exercise live external providers.",
    "network: tests that require public internet access.",
    "browser: tests that require Playwright and Chromium.",
]

[project.urls]
Homepage = "https://github.com/AKzar1el/mcp-trendpulse"
Repository = "https://github.com/AKzar1el/mcp-trendpulse"
Issues = "https://github.com/AKzar1el/mcp-trendpulse/issues"
"Demand Brief" = "https://akzar1el.github.io/mcp-trendpulse/#demand-brief"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
