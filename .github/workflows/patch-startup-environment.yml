name: Patch startup environment boundary

on:
  push:
    branches:
      - refactor/startup-environment

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[startup-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/startup-environment

      - name: Apply idempotent source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          server_path = Path("src/mcp_trendpulse/server.py")
          server = server_path.read_text()
          server = server.replace(
              "from dotenv import load_dotenv\nload_dotenv()\n\n",
              "",
          )
          server = server.replace(
              "from mcp_trendpulse import news\n",
              "from mcp_trendpulse import news\nfrom mcp_trendpulse.config import load_environment\n",
          )
          server = server.replace(
              "async def lifespan(app: FastMCP):\n    async with BrowserManager():\n",
              "async def lifespan(app: FastMCP):\n    load_environment()\n    async with BrowserManager():\n",
          )
          server_path.write_text(server)

          cli_path = Path("src/mcp_trendpulse/cli.py")
          cli = cli_path.read_text()
          cli = cli.replace(
              "import asyncio\nfrom mcp_trendpulse.news import (\n",
              "import asyncio\n\nfrom mcp_trendpulse.config import load_environment\nfrom mcp_trendpulse.news import (\n",
          )
          cli = cli.replace(
              "@click.group()\ndef cli():\n    pass\n",
              "@click.group()\ndef cli():\n    load_environment()\n",
          )
          cli_path.write_text(cli)

          pyproject_path = Path("pyproject.toml")
          pyproject = pyproject_path.read_text()
          marker = "\n[tool.ruff.lint.per-file-ignores]\n"
          if marker in pyproject:
              pyproject = pyproject.split(marker, 1)[0].rstrip() + "\n"
          pyproject_path.write_text(pyproject)
          PY

      - name: Commit patched files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mcp_trendpulse/server.py src/mcp_trendpulse/cli.py pyproject.toml
          git commit -m "refactor: load environment at runtime [startup-patch]"
          git push origin HEAD:refactor/startup-environment
