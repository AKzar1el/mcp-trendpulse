name: Optional intelligence MCP client end-to-end

on:
  pull_request:
    paths:
      - "src/mcp_trendpulse/intelligence_*.py"
      - "scripts/intelligence_mcp_client_e2e.py"
      - ".github/workflows/intelligence-mcp-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-client:
    name: Independent MCP stdio client + public provider E2E
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - name: Independent MCP client exercises six tools without internet
        run: uv run --locked python scripts/intelligence_mcp_client_e2e.py --mode offline --report intelligence-mcp-offline.json
      - name: Independent MCP client executes real public providers
        run: uv run --locked python scripts/intelligence_mcp_client_e2e.py --mode public --report intelligence-mcp-public.json
      - name: Upload source-redacted MCP diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intelligence-mcp-e2e-${{ github.run_id }}
          path: |
            intelligence-mcp-offline.json
            intelligence-mcp-public.json
          if-no-files-found: warn
          retention-days: 7
