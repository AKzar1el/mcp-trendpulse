name: Patch provider boundary

on:
  push:
    branches:
      - refactor/provider-boundary

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[provider-boundary-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/provider-boundary

      - name: Route MCP runtime calls through providers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mcp_trendpulse/server.py")
          text = path.read_text()

          import_marker = "from mcp_trendpulse.middleware import ProviderErrorMiddleware\n"
          provider_import = "from mcp_trendpulse.providers import get_provider_set\n"
          if provider_import not in text:
              assert import_marker in text
              text = text.replace(import_marker, import_marker + provider_import, 1)

          replacements = {
              "await news.get_news_by_keyword(": "await get_provider_set().news.get_news_by_keyword(",
              "await news.get_news_by_location(": "await get_provider_set().news.get_news_by_location(",
              "await news.get_news_by_topic(": "await get_provider_set().news.get_news_by_topic(",
              "await news.get_top_news(": "await get_provider_set().news.get_top_news(",
              "await news.get_news_by_site(": "await get_provider_set().news.get_news_by_site(",
              "url = news.validate_article_url(url)": "url = get_provider_set().news.validate_article_url(url)",
              "article = await news.download_article(url)": "article = await get_provider_set().news.download_article(url)",
              "await news.get_trending_terms(": "await get_provider_set().trends.get_trending_terms(",
              "await news.get_trends(": "await get_provider_set().trends.get_trends(",
              "await news.get_growth(": "await get_provider_set().trends.get_growth(",
              "await news.get_ranked_trends(": "await get_provider_set().trends.get_ranked_trends(",
              "await news.get_top_trends(": "await get_provider_set().trends.get_top_trends(",
              "await news.get_interest_by_region(": "await get_provider_set().trends.get_interest_by_region(",
              "await news.get_related_queries(": "await get_provider_set().trends.get_related_queries(",
              "await news.get_related_topics(": "await get_provider_set().trends.get_related_topics(",
              "await news.get_suggestions(": "await get_provider_set().trends.get_suggestions(",
              "await news.get_categories()": "await get_provider_set().trends.get_categories()",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)

          old_block = '''    trends_out = []\n    for trend in trends:\n        trend = trend.__dict__\n        if "news" in trend:\n            trend["news"] = [TrendingTermArticleOut(**article.__dict__) for article in trend["news"]]\n        trends_out.append(TrendingTermOut(**trend))\n    return trends_out\n'''
          new_block = '''    trends_out = []\n    for trend in trends:\n        trend_data = dict(trend)\n        if "news" in trend_data:\n            trend_data["news"] = [\n                TrendingTermArticleOut(**article) for article in trend_data["news"]\n            ]\n        trends_out.append(TrendingTermOut(**trend_data))\n    return trends_out\n'''
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          else:
              assert new_block in text

          forbidden_runtime_fragments = (
              "await news.get_news_by_keyword(",
              "await news.get_news_by_location(",
              "await news.get_news_by_topic(",
              "await news.get_top_news(",
              "await news.get_news_by_site(",
              "await news.get_trending_terms(",
              "await news.get_trends(",
              "await news.get_growth(",
              "await news.get_ranked_trends(",
              "await news.get_top_trends(",
              "await news.get_interest_by_region(",
              "await news.get_related_queries(",
              "await news.get_related_topics(",
              "await news.get_suggestions(",
              "await news.get_categories()",
              "url = news.validate_article_url(url)",
              "article = await news.download_article(url)",
          )
          assert not any(fragment in text for fragment in forbidden_runtime_fragments)

          path.write_text(text)
          PY

      - name: Commit patched server
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mcp_trendpulse/server.py
          git commit -m "refactor: route MCP tools through provider boundary [provider-boundary-patch]"
          git push origin HEAD:refactor/provider-boundary
