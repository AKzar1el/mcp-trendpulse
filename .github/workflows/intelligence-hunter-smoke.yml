name: Optional intelligence current-trend hunter smoke

on:
  pull_request:
    paths:
      - "src/mcp_trendpulse/intelligence_hunter.py"
      - "src/mcp_trendpulse/intelligence_core.py"
      - "src/mcp_trendpulse/intelligence_foundation.py"
      - "src/mcp_trendpulse/intelligence_commercial.py"
      - "src/mcp_trendpulse/intelligence_extended.py"
      - "scripts/intelligence_hunter_smoke.py"
      - ".github/workflows/intelligence-hunter-smoke.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-hunter:
    name: Free source activity, provenance, and no false trend forecast
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - name: Verify one-time current-first, bounded, keyless live source hunting
        run: uv run --locked python scripts/intelligence_hunter_smoke.py
      - name: Preserve safe availability diagnostics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intelligence-hunter-status-${{ github.run_id }}
          path: intelligence-hunter-status.json
          if-no-files-found: warn
          retention-days: 7
