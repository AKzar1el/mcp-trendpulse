name: Refresh Python 3.14 lock

on:
  push:
    branches:
      - chore/dependency-refresh-python314

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[final-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/dependency-refresh-python314

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Apply validated dependency floors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          text = text.replace(
              '"lxml[html-clean]>=6.0.0",',
              '"lxml[html-clean]>=6.1.1",',
          )
          text = text.replace(
              '"newspaper4k>=0.9.3.1",',
              '"newspaper4k>=0.9.6",',
          )
          text = text.replace(
              '"nltk>=3.9.1",',
              '"nltk>=3.9.4",',
          )
          text = text.replace(
              '"pydantic>=2.11.7",',
              '"pydantic>=2.12.0",',
          )
          if '"pandas>=' not in text:
              text = text.replace(
                  '"nltk>=3.9.4",',
                  '"nltk>=3.9.4",\n    "pandas>=2.3.0",',
              )
          path.write_text(text)
          PY

      - name: Regenerate validated targeted lock
        run: >-
          uv lock
          --upgrade-package lxml
          --upgrade-package newspaper4k
          --upgrade-package nltk
          --upgrade-package pandas
          --upgrade-package pillow
          --upgrade-package pydantic
          --upgrade-package cffi
          --upgrade-package pyyaml
          --upgrade-package regex
          --upgrade-package selectolax

      - name: Commit validated dependency set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: refresh dependencies for Python 3.14 [final-lock]"
          git push origin HEAD:chore/dependency-refresh-python314
