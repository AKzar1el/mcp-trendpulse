name: Optional intelligence keyless multi-lane matrix

on:
  pull_request:
    paths:
      - "src/mcp_trendpulse/intelligence_*.py"
      - "scripts/intelligence_multi_lane_smoke.py"
      - ".github/workflows/intelligence-multi-lane.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  combination-matrix:
    name: Keyless multi-lane live combinations and strict abstention
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - name: Verify scenarios are free, keyless, allowlisted and non-predictive
        run: uv run --locked python scripts/intelligence_multi_lane_smoke.py --mode offline
      - name: Probe six real public-source combinations with bounded queries
        run: uv run --locked python scripts/intelligence_multi_lane_smoke.py --mode live --report intelligence-multi-lane.json
      - name: Preserve source-level availability diagnostics without raw payloads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intelligence-keyless-matrix-${{ github.run_id }}
          path: intelligence-multi-lane.json
          if-no-files-found: warn
          retention-days: 7
