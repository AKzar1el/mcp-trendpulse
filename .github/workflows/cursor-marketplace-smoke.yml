name: Cursor Marketplace smoke

on:
  push:
    branches:
      - chore/cursor-marketplace-20260830

permissions:
  contents: read

jobs:
  cursor-command:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: Smoke exact Cursor MCP command
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time

          proc = subprocess.Popen(
              ["uvx", "--from", "git+https://github.com/AKzar1el/mcp-trendpulse.git", "mcp-trendpulse"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
          )
          assert proc.stdin and proc.stdout
          for message in (
              {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"cursor-marketplace-smoke","version":"1.0.0"}}},
              {"jsonrpc":"2.0","method":"notifications/initialized"},
              {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}},
          ):
              proc.stdin.write(json.dumps(message) + "\n")
          proc.stdin.flush()

          deadline = time.time() + 90
          tools = None
          while time.time() < deadline:
              line = proc.stdout.readline()
              if not line:
                  if proc.poll() is not None:
                      break
                  continue
              try:
                  payload = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if payload.get("id") == 2:
                  tools = payload
                  break

          proc.terminate()
          try:
              proc.wait(timeout=5)
          except subprocess.TimeoutExpired:
              proc.kill()

          if tools is None:
              err = proc.stderr.read() if proc.stderr else ""
              raise SystemExit(f"tools/list response missing\n{err}")
          names = {tool.get("name") for tool in tools.get("result", {}).get("tools", [])}
          required = {"get_news_by_keyword", "get_trends", "get_related_queries", "get_categories"}
          missing = required - names
          if missing:
              raise SystemExit(f"missing expected tools: {sorted(missing)}")
          print(f"Cursor command MCP handshake passed with {len(names)} tools")
          PY
