name: Cleanup Registry manifest formatting

on:
  push:
    branches:
      - chore/official-mcp-registry
    paths:
      - .github/workflows/cleanup-registry-format.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/official-mcp-registry
      - name: Restore untouched JSON formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server.json')
          lines = path.read_text().splitlines()
          changed = False
          for i, line in enumerate(lines):
              if '"timeframe": {' not in line or i + 8 >= len(lines):
                  continue
              if lines[i + 1].strip() != '"anyOf": [':
                  continue
              if not (
                  lines[i + 2].strip() == '{'
                  and lines[i + 3].strip() == '"type": "string"'
                  and lines[i + 4].strip() == '},'
                  and lines[i + 5].strip() == '{'
                  and lines[i + 6].strip() == '"type": "null"'
                  and lines[i + 7].strip() == '}'
                  and lines[i + 8].strip() == '],'
              ):
                  continue
              indent = lines[i + 2][: len(lines[i + 2]) - len(lines[i + 2].lstrip())]
              lines[i + 2 : i + 8] = [
                  f'{indent}{{ "type": "string" }},',
                  f'{indent}{{ "type": "null" }}',
              ]
              changed = True
              break
          if not changed:
              raise SystemExit('expected generated timeframe formatting not found')
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.json
          git commit -m 'chore: preserve existing manifest formatting'
          git push origin HEAD:chore/official-mcp-registry
