name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync locked environment
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --dev

      - name: Run unit tests
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --locked pytest

      - name: Run Ruff
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --locked ruff check .

  package:
    name: Package validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lockfile and sync environment
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked --dev

      - name: Build distributions
        env:
          UV_PYTHON: "3.12"
        run: uv build

      - name: Validate distribution metadata
        env:
          UV_PYTHON: "3.12"
        run: uv run --with twine twine check dist/*

      - name: Smoke test built wheel
        run: |
          SMOKE_VENV="${RUNNER_TEMP}/mcp-trendpulse-wheel-smoke"
          uv venv --python 3.12 "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install dist/*.whl
          "$SMOKE_VENV/bin/python" -c "import mcp_trendpulse"
