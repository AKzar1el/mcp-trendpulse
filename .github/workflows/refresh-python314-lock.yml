name: Refresh Python 3.14 lock

on:
  push:
    branches:
      - chore/dependency-refresh-python314

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/dependency-refresh-python314

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Patch direct dependencies and CI matrix
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject_path = Path("pyproject.toml")
          pyproject = pyproject_path.read_text()
          pyproject = pyproject.replace(
              '"lxml[html-clean]>=6.0.0",',
              '"lxml[html-clean]>=6.1.1",',
          )
          if '"pandas>=' not in pyproject:
              pyproject = pyproject.replace(
                  '"nltk>=3.9.1",',
                  '"nltk>=3.9.1",\n    "pandas>=2.3.0",',
              )
          pyproject_path.write_text(pyproject)

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text()
          if '          - "3.14"' not in ci:
              ci = ci.replace(
                  '          - "3.13"\n',
                  '          - "3.13"\n          - "3.14"\n',
              )
          ci_path.write_text(ci)
          PY

      - name: Regenerate targeted lock entries and capture diagnostics
        id: lock
        shell: bash
        run: |
          set +e
          uv lock --upgrade-package lxml --upgrade-package pandas > lock-refresh.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat lock-refresh.log
          exit 0

      - name: Commit candidate or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml .github/workflows/ci.yml lock-refresh.log
          if [ "${{ steps.lock.outputs.status }}" = "0" ]; then
            git add uv.lock
          fi
          git commit -m "chore: capture Python 3.14 lock candidate [lock-refresh]"
          git push origin HEAD:chore/dependency-refresh-python314
