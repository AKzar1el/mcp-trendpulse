name: Publish package

on:
  pull_request:
    paths:
      - README.md
      - server.json
      - pyproject.toml
      - .github/workflows/publish.yml
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Validate and build release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.5"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        env:
          UV_PYTHON: "3.12"
        run: uv sync --locked --dev

      - name: Verify Registry package metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          server = json.loads(Path('server.json').read_text())
          version = '0.2.11'
          assert server['name'] == 'io.github.AKzar1el/mcp-trendpulse'
          assert server['version'] == version
          assert '<!-- mcp-name: io.github.AKzar1el/mcp-trendpulse -->' in Path('README.md').read_text()
          package = server['packages'][0]
          assert package == {
              'registryType': 'pypi',
              'registryBaseUrl': 'https://pypi.org',
              'identifier': 'mcp-trendpulse',
              'version': version,
              'runtimeHint': 'uvx',
              'transport': {'type': 'stdio'},
          }
          PY

      - name: Run unit tests
        env:
          UV_PYTHON: "3.12"
        run: uv run --locked pytest

      - name: Run Ruff
        env:
          UV_PYTHON: "3.12"
        run: uv run --locked ruff check .

      - name: Build package distributions
        env:
          UV_PYTHON: "3.12"
        run: uv build

      - name: Validate package metadata
        env:
          UV_PYTHON: "3.12"
        run: uv run --with twine twine check dist/*

      - name: Smoke test built wheel
        run: |
          SMOKE_VENV="${RUNNER_TEMP}/mcp-trendpulse-wheel-smoke"
          uv venv --python 3.12 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" dist/*.whl
          "$SMOKE_VENV/bin/python" -c "import mcp_trendpulse"

      - name: Upload package distributions
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-registry:
    name: Publish to official MCP Registry
    if: github.event_name != 'pull_request'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Log in to the Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish Registry metadata
        run: ./mcp-publisher publish server.json
