name: Dispatch TrendPulse v0.2.11 package publish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-publish-v0.2.11.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publish.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
